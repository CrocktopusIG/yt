<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening YouTube...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #f9f9f9; color: #333; text-align: center;
        }
        .container { padding: 20px; max-width: 400px; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px;
            border-radius: 50%; border-left-color: #ff0000;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 1.3rem; margin-bottom: 10px; }
        p { color: #666; font-size: 0.95rem; }
        a { color: #ff0000; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Opening in YouTube app...</h2>
        <p>If the app does not open automatically, <a id="fallback-link" href="#">click here</a>.</p>
    </div>

    <script>
        (function() {
            // 1. UPDATE THIS to your default YouTube channel fallback URL
            var defaultUrl = "https://youtu.be/DQarvJvZSDk"; 

            // 2. Parse dynamic parameter out of the URL bar (?v=ID or ?si=ID or channel paths)
            var urlParams = new URLSearchParams(window.location.search);
            var videoId = urlParams.get('v');

            var targetWebUrl = defaultUrl;
            var appPath = "";

            if (videoId) {
                targetWebUrl = "https://www.youtube.com/watch?v=" + videoId;
                appPath = "www.youtube.com/watch?v=" + videoId;
            } else {
                // If it's a channel, strip protocol for clean app deep-linking
                appPath = defaultUrl.replace("https://", "").replace("http://", "");
            }
            
            // Build cross-platform execution strings
            var iosAppUrl = "youtube://" + appPath;
            var androidIntent = "intent://" + appPath + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(targetWebUrl) + ";end";

            // Update manual button text for instant user interactions
            var fallbackBtn = document.getElementById("fallback-link");
            fallbackBtn.href = targetWebUrl;

            // Refined User Agent Detection
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /android/i.test(userAgent);
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isAndroid) {
                // Android intents reliably pull out of Instagram instantly
                window.location.href = androidIntent;
            } else if (isIOS) {
                // IMPROVED FOR iOS INSTAGRAM: Create an invisible frame to bypass JS execution blocks
                var iframe = document.createElement("iframe");
                iframe.style.border = "none";
                iframe.style.width = "1px";
                iframe.style.height = "1px";
                iframe.src = iosAppUrl;
                document.body.appendChild(iframe);

                // Secondary attempt using location modification 
                setTimeout(function() {
                    window.location.href = iosAppUrl;
                }, 100);

                // Final Web browser Fallback if user doesn't have YouTube app installed
                setTimeout(function() {
                    window.location.href = targetWebUrl;
                }, 2500);
            } else {
                // Standard desktop environments jump directly to standard web page
                window.location.href = targetWebUrl;
            }
        })();
    </script>
</body>
</html>
